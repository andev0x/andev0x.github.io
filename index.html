    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

    <meta property="og:type" content="website" />

      name="twitter:description"
      content="Development, Neovim, containers and systems work — a keyboard-first tech blog."
    />

    <script>
      // Resolve the theme before first paint so there is never a flash of the
      // wrong palette. Kept tiny and dependency-free on purpose.
      ;(function () {
        try {
          var stored = localStorage.getItem('andev0x-theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode / storage disabled — fall back to the light palette */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: ui-monospace, monospace; padding: 2rem">
        This blog renders client-side. Enable JavaScript to read the posts.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
